<!DOCTYPE html>
<!-- data-wide="off" 留着是声明意图：子页不要大屏装饰层。
     实际上 head 里已经不加载 wide.css 了，这个属性现在没有对应的规则，
     但若哪天子页想开装饰层，改这里 + 补一行 link 就够。 -->
<html lang="zh-CN" data-wide="off" data-page="sub" data-slug="system-design">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统设计 — 森韵次元坞</title>
<meta name="description" content="结构化的界面逻辑与组件体系">

<!-- 站点图标：由 build/icons.py 从 assets/logo.png 派生，全部垫了 --paper
     底色（logo 是纯黑 + 透明，留透明的话深色浏览器 UI 上就看不见了）。
     改 logo 后重跑 python build/icons.py 即可，无需手工导出。 -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- 浏览器 UI 配色跟随两套调色板，取值与 style.css / theme.css 的 --paper 一致 -->
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0c" media="(prefers-color-scheme: dark)">

<!-- 分享卡片。canonical / og:url / og:image 要求绝对地址，所以这三条只在
     pages.js 配了 SITE_URL 时才输出——域名填错比不填更糟（会把爬虫指到
     别人家去）。其余几条与域名无关，任何情况下都给。 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="森韵次元坞">
<meta property="og:locale" content="zh_CN">
<meta property="og:title" content="系统设计 — 森韵次元坞">
<meta property="og:description" content="结构化的界面逻辑与组件体系">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="系统设计 — 森韵次元坞">
<meta name="twitter:description" content="结构化的界面逻辑与组件体系">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="stage.css">
<!-- 深色模式调色板，可整行删除 -->
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="page.css">
<!-- 主题必须在首帧前定好，否则深色偏好的用户会先看到一帧白底。
     故意内联且放在样式表之后：这段极短，阻塞可忽略。
     无此脚本时 theme.css 的 @media 仍会跟随系统，只是失去手动选择。 -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("ces-theme");
      if (t === "dark" || t === "light") {
        document.documentElement.setAttribute("data-theme", t);
      }
    } catch (e) {
      /* 隐私模式下 localStorage 可能抛异常，落回系统偏好即可 */
    }
  })();
</script>

<!-- 入场信号：必须在首帧之前决定，否则会先画冷启动布局再跳变。
     与主题防闪白同一手法（内联、放在样式表之后）。
     只有子页面需要这段；首页不参与。 -->
<script>
  (function () {
    var root = document.documentElement;

    // 必须无条件、在任何 return 之前加上：page.css 的初始隐藏态全挂在这个类下。
    // 脚本没跑 = 类不存在 = 内容默认可见，脚本失效不会留白屏。
    root.classList.add("js-enter");

    // 兜底：入场由 script.js 推进（rAF 后加 .page-ready）。若 script.js
    // 加载失败或在到达那段之前抛异常，横条与正文会永久停在 opacity:0。
    // 同样必须在任何 return 之前，冷启动路径也要有这层保险。
    setTimeout(function () {
      root.classList.add("page-ready");
    }, 1400);

    // 浏览器可能在导航后恢复上一次的滚动位置。入场动画依赖 scrollY=0
    // 时 fixed 坐标与文档流位置重合，所以这里关掉自动恢复。
    try {
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    } catch (e) {}

    var raw = null;
    try {
      raw = sessionStorage.getItem("ces-nav");
      sessionStorage.removeItem("ces-nav");
    } catch (e) {
      return; // 拿不到信号就走冷启动入场，不是错误
    }
    if (!raw) return;

    var sig;
    try {
      sig = JSON.parse(raw);
    } catch (e) {
      return;
    }

    // 过期保护：标签页搁置很久、或退场播了但跳转被取消，
    // 陈旧记录不该触发形变入场。
    var age = Date.now() - (sig.ts || 0);
    if (age < 0 || age > 2500) return;
    if (sig.from !== "stage") return;
    if (sig.slug !== root.getAttribute("data-slug")) return;

    root.classList.add("nav-enter");
  })();
</script>

<noscript>
  <!-- 子页面没有开屏，只需把依赖 JS 的入场与揭示直接就位。
       无脚本时 html.nav-enter 也加不上，所以入场那套本就不会生效，
       这里主要负责滚动揭示与自定义光标。 -->
  <style>
    .reveal-line, .reveal-item { opacity: 1 !important; transform: none !important; }
    .cursor { display: none !important; }
    .theme-toggle { display: none !important; }
  </style>
</noscript>

</head>
