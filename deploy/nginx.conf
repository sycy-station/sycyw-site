# Include this server block from nginx.conf's http {} context.
# Serve dist/, never the editable repository directory.
server {
    listen 80;
    server_name _; # Set the real domain and configure HTTPS before public launch.
    root /var/www/sycyw-site;
    index index.html;
    charset utf-8;
    include mime.types;
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;
    # Enable when nginx -V lists --with-http_gzip_static_module:
    # gzip_static on;
    # Brotli requires a separately installed module; .br files are prebuilt.

    location ~* "^/assets/.*\.[0-9a-f]{12}\.[a-z0-9]+$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location ~ /\. {
        deny all;
    }
}
