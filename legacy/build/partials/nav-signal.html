<script>
  (function () {
    var root = document.documentElement;
    root.classList.add("js-enter");

    setTimeout(function () {
      root.classList.add("page-ready");
    }, 1400);

    try {
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    } catch (e) {}

    var raw = null;
    try {
      raw = sessionStorage.getItem("ces-nav");
      sessionStorage.removeItem("ces-nav");
    } catch (e) {
      return;
    }
    if (!raw) return;
    var sig;
    try {
      sig = JSON.parse(raw);
    } catch (e) {
      return;
    }

    var age = Date.now() - (sig.ts || 0);
    if (age < 0 || age > 2500) return;
    if (sig.slug !== root.getAttribute("data-slug")) return;

    if (sig.from === "stage") {
      root.classList.add("nav-enter");
    } else if (sig.from === "sub-sub") {
      root.classList.add("nav-sub");
    }
  })();
</script>
