<script>
  (function () {
    var root = document.documentElement;
    var raw = null;
    try {
      raw = sessionStorage.getItem("ces-nav");
    } catch (e) {
      return;
    }
    if (!raw) return;
    var sig;
    try {
      sig = JSON.parse(raw);
    } catch (e) {
      return;
    }

    if (sig.from !== "sub") return;
    var age = Date.now() - (sig.ts || 0);
    if (age < 0 || age > 2500) {
      try { sessionStorage.removeItem("ces-nav"); } catch (e) {}
      return;
    }

    try { sessionStorage.removeItem("ces-nav"); } catch (e) {}

    root.setAttribute("data-back-no", sig.no || "");
    root.classList.add("nav-back");

    setTimeout(function () {
      document.body && document.body.classList.add("stage-back");
    }, 1400);
  })();
</script>
