<!DOCTYPE html>

<html lang="zh-CN" data-wide="off" data-page="sub" data-slug="{{ slug }}">
<head>
{{> head }}
{{> nav-signal }}
{{> noscript-page }}
</head>
<body>

  <div class="noise" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"></div>

{{> header }}

  <nav class="index-bar" aria-label="分区索引">
    <div class="ib-scroll">
      <div class="ib-track">
{{ indexBar }}

        <div class="ib-scale" aria-hidden="true">
          <div class="ib-scale-dense"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="page-main" id="top">

    <header class="page-title" id="pageTitle">
      <span class="pt-no">{{ no }}</span>
      <h1 class="pt-name">{{ title }}</h1>
      <span class="pt-sub">{{ subNbsp }}</span>
    </header>

    <p class="page-desc reveal-line">{{ desc }}</p>

{{ pageBody }}

  </main>

{{> footer }}

  <script src="script.js">
</script>
</body>
</html>
