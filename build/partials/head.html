<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ pageTitle }}</title>
<meta name="description" content="{{ pageDesc }}">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0c" media="(prefers-color-scheme: dark)">

{{ canonical }}
<meta property="og:type" content="website">
<meta property="og:site_name" content="森韵次元坞">
<meta property="og:locale" content="zh_CN">
<meta property="og:title" content="{{ pageTitle }}">
<meta property="og:description" content="{{ pageDesc }}">
{{ ogUrl }}
{{ ogImage }}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ pageTitle }}">
<meta name="twitter:description" content="{{ pageDesc }}">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="stage.css">
{{ wideCss }}

<link rel="stylesheet" href="theme.css">
{{ extraCss }}

<script>
  (function () {
    try {
      var t = localStorage.getItem("ces-theme");
      if (t === "dark" || t === "light") {
        document.documentElement.setAttribute("data-theme", t);
      }
    } catch (e) {
    }
  })();
</script>
